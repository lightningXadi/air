<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AIR</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #eee;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
  }
  .card {
    background: #1a1d24;
    padding: 32px;
    border-radius: 16px;
    width: 90%;
    max-width: 360px;
    text-align: center;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  h1 { font-size: 22px; margin-bottom: 4px; letter-spacing: 2px; }
  p.sub { color: #888; font-size: 13px; margin-top: 0; margin-bottom: 20px; }
  input {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: 1px solid #333;
    background: #0f1115;
    color: #eee;
    font-size: 15px;
    margin-bottom: 12px;
  }
  button {
    width: 100%;
    padding: 12px;
    border-radius: 8px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    margin-bottom: 8px;
  }
  #joinBtn { background: #4f8cff; color: white; }
  #hangupBtn { background: #ff4f4f; color: white; display:none; }
  #status { margin-top: 16px; font-size: 14px; color: #aaa; min-height: 20px; }
  .mic-indicator {
    width: 14px; height: 14px; border-radius: 50%;
    background: #444; display: inline-block; margin-right: 6px;
    transition: background 0.15s;
  }
  .mic-indicator.active { background: #4fff88; }
  audio { display: none; }
</style>
</head>
<body>
  <div class="card">
    <h1>AIR</h1>
    <p class="sub">Enter the same room code (up to 6 people) to connect.</p>
    <input id="roomInput" placeholder="Room code (e.g. mycall123)" />
    <button id="joinBtn">Join Call</button>
    <button id="hangupBtn">Hang Up</button>
    <div id="status"><span class="mic-indicator" id="micDot"></span><span id="statusText">Not connected</span></div>
    <div id="participants" style="margin-top:10px; font-size:13px; color:#888;"></div>
  </div>

  <div id="audioContainer"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const joinBtn = document.getElementById("joinBtn");
    const hangupBtn = document.getElementById("hangupBtn");
    const roomInput = document.getElementById("roomInput");
    const statusText = document.getElementById("statusText");
    const micDot = document.getElementById("micDot");
    const audioContainer = document.getElementById("audioContainer");
    const participantsEl = document.getElementById("participants");

    let localStream = null;
    let roomId = null;
    const peers = new Map(); // peerId -> RTCPeerConnection

    // Fetched fresh from Metered's TURN credentials API on load.
    let ICE_SERVERS = [{ urls: "stun:stun.l.google.com:19302" }]; // fallback until fetch completes

    async function loadIceServers() {
      try {
        const res = await fetch("https://ashborn.metered.live/api/v1/turn/credentials?apiKey=2592e5a67b1df0493a1570c59e03510cc944");
        const servers = await res.json();
        if (Array.isArray(servers) && servers.length) {
          ICE_SERVERS = servers;
        }
      } catch (err) {
        console.error("Failed to load TURN credentials, falling back to STUN only:", err);
      }
    }
    loadIceServers();

    function setStatus(text, micActive = false) {
      statusText.textContent = text;
      micDot.classList.toggle("active", micActive);
    }

    function updateParticipantCount() {
      const count = peers.size + (localStream ? 1 : 0);
      participantsEl.textContent = count > 0 ? `${count} in call` : "";
    }

    async function joinCall() {
      roomId = roomInput.value.trim();
      if (!roomId) return alert("Enter a room code first.");

      setStatus("Setting up connection...", false);
      await loadIceServers();

      try {
        localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      } catch (err) {
        return alert("Microphone permission is required: " + err.message);
      }

      joinBtn.style.display = "none";
      hangupBtn.style.display = "block";
      roomInput.disabled = true;
      setStatus("Waiting for others to join...", true);

      socket.emit("join", roomId);
    }

    function createPeerConnection(peerId) {
      const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
      peers.set(peerId, pc);

      localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));

      pc.onicecandidate = (event) => {
        if (event.candidate) {
          socket.emit("signal", { to: peerId, data: { candidate: event.candidate } });
        }
      };

      pc.ontrack = (event) => {
        let audioEl = document.getElementById("audio-" + peerId);
        if (!audioEl) {
          audioEl = document.createElement("audio");
          audioEl.id = "audio-" + peerId;
          audioEl.autoplay = true;
          audioEl.playsInline = true;
          audioContainer.appendChild(audioEl);
        }
        audioEl.srcObject = event.streams[0];
        setStatus("Connected — call in progress", true);
        updateParticipantCount();
      };

      pc.onconnectionstatechange = () => {
        if (["disconnected", "failed", "closed"].includes(pc.connectionState)) {
          removePeer(peerId);
        }
      };

      return pc;
    }

    function removePeer(peerId) {
      const pc = peers.get(peerId);
      if (pc) { pc.close(); peers.delete(peerId); }
      const audioEl = document.getElementById("audio-" + peerId);
      if (audioEl) audioEl.remove();
      updateParticipantCount();
      if (peers.size === 0 && localStream) {
        setStatus("Waiting for others to join...", true);
      }
    }

    async function callPeer(peerId) {
      const pc = createPeerConnection(peerId);
      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      socket.emit("signal", { to: peerId, data: { sdp: offer } });
    }

    socket.on("joined", async ({ existingPeers }) => {
      // Call everyone who is already in the room
      for (const peerId of existingPeers) {
        await callPeer(peerId);
      }
      updateParticipantCount();
    });

    socket.on("room-full", () => {
      alert("This room already has 6 people in it (max for group calls). Try a different code.");
      hangup();
    });

    socket.on("peer-joined", async ({ peerId }) => {
      // Existing members wait for the newcomer's offer (handled in "signal"),
      // but we prep nothing here — newcomer initiates via callPeer.
    });

    socket.on("signal", async ({ from, data }) => {
      let pc = peers.get(from);
      if (!pc) pc = createPeerConnection(from);

      if (data.sdp) {
        await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
        if (data.sdp.type === "offer") {
          const answer = await pc.createAnswer();
          await pc.setLocalDescription(answer);
          socket.emit("signal", { to: from, data: { sdp: answer } });
        }
      } else if (data.candidate) {
        try {
          await pc.addIceCandidate(new RTCIceCandidate(data.candidate));
        } catch (e) {
          console.error("ICE candidate error", e);
        }
      }
      updateParticipantCount();
    });

    socket.on("peer-left", ({ peerId }) => {
      removePeer(peerId);
    });

    function hangup() {
      socket.emit("hangup");
      peers.forEach((pc) => pc.close());
      peers.clear();
      audioContainer.innerHTML = "";
      if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }
      joinBtn.style.display = "block";
      hangupBtn.style.display = "none";
      roomInput.disabled = false;
      setStatus("Not connected", false);
      participantsEl.textContent = "";
      socket.disconnect();
      socket.connect();
    }

    joinBtn.addEventListener("click", joinCall);
    hangupBtn.addEventListener("click", hangup);
  </script>
</body>
</html>
