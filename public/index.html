<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>AIR</title>

<!-- PWA -->
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#2b2620" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="AIR" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --outer: #17140f;
    --cream: #e9dfc7;
    --cream-2: #f2e9d4;
    --ink: #2b2620;
    --ink-soft: #5c5140;
    --line: #2b2620;

    --amber: #dba549;
    --amber-dark: #b2812f;
    --green: #8aa66b;
    --green-dark: #63804a;
    --blue: #86aebb;
    --blue-dark: #5f8794;
    --red: #c1493f;
    --red-dark: #96322a;
    --plum: #b98cc0;
    --plum-dark: #8c66a1;
    --teal: #5aa6a0;
    --teal-dark: #3e7d78;

    --shadow: 4px 4px 0 var(--ink);
    --shadow-sm: 3px 3px 0 var(--ink);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: var(--outer);
    color: var(--ink);
    font-family: 'Space Mono', monospace;
    overscroll-behavior-y: auto;
    -webkit-tap-highlight-color: transparent;
  }

  * { -webkit-tap-highlight-color: transparent; }
  button, input, .tile, a { -webkit-tap-highlight-color: transparent; outline: none; }
  button:focus, input:focus { outline: none; }

  .heading {
    font-family: 'Bungee', sans-serif;
    letter-spacing: 0.04em;
    color: var(--ink);
    text-shadow: 3px 3px 0 rgba(0,0,0,0.12);
  }

  #app {
    min-height: 100vh;
    width: 100vw;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 18px;
    touch-action: pan-y;
  }

  .panel {
    background: var(--cream);
    border: 4px solid var(--ink);
    border-radius: 22px;
    box-shadow: var(--shadow);
    width: 100%;
    max-width: 520px;
    padding: 34px 26px;
  }

  /* ---------- lobby ---------- */
  #lobby { display: flex; flex-direction: column; align-items: center; text-align: center; }

  #lobby .heading { font-size: 40px; margin: 0 0 4px; }
  #lobby .sub { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 28px; }

  .field {
    width: 100%;
    background: var(--cream-2);
    border: 3px solid var(--ink);
    border-radius: 10px;
    padding: 12px 14px;
    font-family: 'Space Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.05em;
    color: var(--ink);
    outline: none;
    margin-bottom: 14px;
    box-shadow: inset 0 2px 0 rgba(0,0,0,0.06);
  }
  .field::placeholder { color: #a89a7d; text-transform: uppercase; letter-spacing: 0.1em; font-size: 11px; }
  .field:focus { border-color: var(--teal-dark); }

  .btn {
    font-family: 'Space Mono', monospace;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    border: 3px solid var(--ink);
    border-radius: 10px;
    padding: 13px 26px;
    cursor: pointer;
    box-shadow: var(--shadow-sm);
    transition: transform 0.08s ease, box-shadow 0.08s ease;
    color: var(--ink);
    touch-action: manipulation;
  }
  .btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .btn:disabled { opacity: 0.5; cursor: default; }

  .btn-green { background: var(--green); }
  .btn-green:hover:not(:disabled) { background: var(--green-dark); }

  #joinBtn { margin-top: 12px; width: 100%; background: var(--green); }
  #joinBtn:hover:not(:disabled) { background: var(--green-dark); }

  #lobbyStatus { margin-top: 18px; font-size: 11px; letter-spacing: 0.08em; color: var(--red-dark); min-height: 14px; }

  /* ---------- call screen ---------- */
  #callScreen { display: none; flex-direction: column; align-items: stretch; }

  #callTop { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  #callTop .heading { font-size: 22px; margin: 0; }
  #roomLabel {
    font-size: 11px; background: var(--cream-2); border: 2px solid var(--ink); border-radius: 8px;
    padding: 6px 10px; letter-spacing: 0.1em; color: var(--ink-soft);
  }

  #grid {
    display: grid;
    gap: 12px;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    margin-bottom: 20px;
  }

  .tile {
    position: relative;
    background: var(--cream-2);
    border: 3px solid var(--ink);
    border-radius: 14px;
    box-shadow: var(--shadow-sm);
    min-height: 150px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 20px 10px;
    transition: transform 0.2s, box-shadow 0.2s;
  }

  .tile { --pc: var(--amber); --pc-dark: var(--amber-dark); }

  .badge {
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--pc);
    border: 3px solid var(--ink);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bungee', sans-serif;
    font-size: 15px;
    color: var(--ink);
    transition: transform 0.25s, box-shadow 0.25s;
  }

  .tile.speaking { transform: translate(-2px, -2px); box-shadow: 6px 6px 0 var(--pc-dark); border-color: var(--pc-dark); }
  .tile.speaking .badge { transform: scale(1.1); box-shadow: 0 0 0 4px var(--pc); animation: ring 1.2s ease-in-out infinite; }
  @keyframes ring { 0%, 100% { box-shadow: 0 0 0 3px var(--pc); } 50% { box-shadow: 0 0 0 6px var(--pc); } }

  .tile .name { font-size: 13px; font-weight: 700; letter-spacing: 0.05em; color: var(--ink); text-align: center; }
  .tile .state { font-size: 10px; letter-spacing: 0.15em; text-transform: uppercase; color: var(--ink-soft); }
  .tile.speaking .state { color: var(--pc-dark); font-weight: 700; }

  .tile.muted { background: #c9bb98; }
  .tile.muted .badge { background: var(--red); filter: grayscale(0.3); opacity: 0.85; }
  .tile.muted .state { color: var(--red-dark); font-weight: 700; }
  .tile.muted .name { color: var(--ink-soft); opacity: 0.7; }

  .tile.is-local { border-width: 4px; }
  .tile.is-local::before {
    content: "YOU";
    position: absolute; top: 8px; left: 8px;
    font-family: 'Space Mono', monospace; font-size: 8px; font-weight: 700;
    letter-spacing: 0.1em; color: var(--ink); background: var(--cream);
    border: 2px solid var(--ink); border-radius: 6px; padding: 2px 6px;
  }

  .mute-badge {
    position: absolute; top: 8px; right: 8px; width: 20px; height: 20px; border-radius: 50%;
    background: var(--red); border: 2px solid var(--ink);
    display: none; align-items: center; justify-content: center; font-size: 10px; color: var(--cream); font-weight: 700;
  }
  .tile.muted .mute-badge { display: flex; }

  .tile.reconnecting { border-style: dashed; animation: flicker 1.3s ease-in-out infinite; }
  .tile.reconnecting .state { color: var(--red-dark); }
  @keyframes flicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

  /* ---------- controls ---------- */
  #controls { display: flex; align-items: center; justify-content: center; gap: 12px; }

  .ctrl-btn {
    width: 58px; height: 58px; border-radius: 14px; border: 3px solid var(--ink);
    background: var(--blue); color: var(--ink); cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    box-shadow: var(--shadow-sm); transition: transform 0.08s, box-shadow 0.08s; flex-shrink: 0;
    touch-action: manipulation;
  }
  .ctrl-btn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
  .ctrl-btn svg { width: 20px; height: 20px; }
  .ctrl-btn .ctrl-label { font-size: 7px; letter-spacing: 0.05em; font-weight: 700; }

  #muteBtn { background: var(--green); }
  #muteBtn.active { background: var(--red); }

  #speakerBtn { background: var(--blue); }
  #speakerBtn.active { background: var(--plum); }

  #hangupBtn {
    height: 58px; padding: 0 24px; border-radius: 14px;
    background: var(--red); border: 3px solid var(--ink);
    color: var(--cream); font-family: 'Space Mono', monospace; font-size: 12px; font-weight: 700;
    letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer;
    display: flex; align-items: center; gap: 8px; box-shadow: var(--shadow-sm);
    transition: transform 0.08s, box-shadow 0.08s; flex-shrink: 0; touch-action: manipulation;
  }
  #hangupBtn svg { width: 18px; height: 18px; }
  #hangupBtn:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }

  #callStatus { text-align: center; font-size: 10px; letter-spacing: 0.12em; color: var(--ink-soft); text-transform: uppercase; margin-bottom: 14px; }
</style>
</head>
<body>
<div id="app">

  <div id="lobby" class="panel">
    <div class="heading">AIR</div>
    <div class="sub">voice, only when it matters</div>
    <input id="nameInput" class="field" placeholder="your name" autocomplete="off" maxlength="24" />
    <input id="roomInput" class="field" placeholder="room code" autocomplete="off" />
    <button id="joinBtn" class="btn">Join Call</button>
    <button id="installBtn" class="btn btn-green" style="display:none; margin-top:10px; width:100%;">Install App</button>
    <div id="lobbyStatus"></div>
  </div>

  <div id="callScreen" class="panel">
    <div id="callTop">
      <div class="heading">AIR</div>
      <div id="roomLabel"></div>
    </div>
    <div id="grid"></div>
    <div id="callStatus"></div>
    <div id="controls">
      <button id="muteBtn" class="ctrl-btn" title="Mute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0"/><path d="M12 18v3"/></svg>
        <span class="ctrl-label">MUTE</span>
      </button>
      <button id="speakerBtn" class="ctrl-btn" title="Speaker / earpiece">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/><path d="M19.5 6a9 9 0 0 1 0 12"/></svg>
        <span class="ctrl-label" id="speakerLabel">SPEAKER</span>
      </button>
      <button id="hangupBtn" title="Leave call">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 9c-2.5 0-4.9.5-7 1.5-.6.3-1 .9-1 1.6v2.4c0 .8.6 1.5 1.4 1.5.2 0 .4 0 .5-.1l3-1c.5-.2.8-.6.9-1.1l.2-1.4c1.3-.3 2.6-.5 4-.5s2.7.2 4 .5l.2 1.4c.1.5.4.9.9 1.1l3 1c.2.1.4.1.5.1.8 0 1.4-.7 1.4-1.5v-2.4c0-.7-.4-1.3-1-1.6C16.9 9.5 14.5 9 12 9Z"/></svg>
        End
      </button>
    </div>
  </div>

</div>

<div id="audioContainer"></div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();

  const lobby = document.getElementById("lobby");
  const callScreen = document.getElementById("callScreen");
  const joinBtn = document.getElementById("joinBtn");
  const nameInput = document.getElementById("nameInput");
  const roomInput = document.getElementById("roomInput");
  const lobbyStatus = document.getElementById("lobbyStatus");
  const roomLabel = document.getElementById("roomLabel");
  const grid = document.getElementById("grid");
  const callStatus = document.getElementById("callStatus");
  const muteBtn = document.getElementById("muteBtn");
  const speakerBtn = document.getElementById("speakerBtn");
  const speakerLabel = document.getElementById("speakerLabel");
  const hangupBtn = document.getElementById("hangupBtn");
  const audioContainer = document.getElementById("audioContainer");

  let localStream = null;
  let roomId = null;
  let localName = "You";
  let isMuted = false;
  let onSpeaker = true;
  let audioCtx = null;
  const peers = new Map();
  const analysers = new Map();
  const peerNames = new Map();
  let rafId = null;

  // ---------- per-participant color (matches the chunky UI-kit palette) ----------
  const PALETTE = [
    { pc: "#dba549", dark: "#b2812f" }, // amber
    { pc: "#8aa66b", dark: "#63804a" }, // green
    { pc: "#86aebb", dark: "#5f8794" }, // blue
    { pc: "#b98cc0", dark: "#8c66a1" }, // plum
    { pc: "#5aa6a0", dark: "#3e7d78" }, // teal
    { pc: "#c9915a", dark: "#a06d3c" }, // burnt orange
  ];
  function colorFor(key) {
    let h = 0;
    for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  function initials(name) {
    return (name || "?").trim().split(/\s+/).slice(0, 2).map((w) => w[0]?.toUpperCase() || "").join("");
  }

  let ICE_SERVERS = [{ urls: "stun:stun.l.google.com:19302" }];

  async function loadIceServers() {
    try {
      const res = await fetch("https://ashborn.metered.live/api/v1/turn/credentials?apiKey=2592e5a67b1df0493a1570c59e03510cc944");
      const servers = await res.json();
      if (Array.isArray(servers) && servers.length) ICE_SERVERS = servers;
    } catch (err) {
      console.error("Failed to load TURN credentials, falling back to STUN only:", err);
    }
  }
  loadIceServers();

  function setLobbyStatus(text) { lobbyStatus.textContent = text; }
  function setCallStatus(text) { callStatus.textContent = text; }

  function tileId(peerId) { return "tile-" + peerId; }

  function createTile(peerId, label) {
    const tile = document.createElement("div");
    tile.className = "tile";
    if (peerId === "local") tile.classList.add("is-local");
    tile.id = tileId(peerId);
    const c = colorFor(peerId);
    tile.style.setProperty("--pc", c.pc);
    tile.style.setProperty("--pc-dark", c.dark);
    const safeLabel = (label || "Anonymous").replace(/</g, "&lt;");
    tile.innerHTML = `
      <div class="mute-badge">✕</div>
      <div class="badge">${initials(label)}</div>
      <div class="name">${safeLabel}</div>
      <div class="state">Connecting</div>
    `;
    if (peerId === "local") grid.prepend(tile); else grid.appendChild(tile);
    return tile;
  }

  function getTile(peerId, label) {
    return document.getElementById(tileId(peerId)) || createTile(peerId, label);
  }

  function setTileState(peerId, stateText, { speaking = false, muted = false, reconnecting = false } = {}) {
    const tile = document.getElementById(tileId(peerId));
    if (!tile) return;
    tile.classList.toggle("speaking", speaking);
    tile.classList.toggle("muted", muted);
    tile.classList.toggle("reconnecting", reconnecting);
    const stateEl = tile.querySelector(".state");
    if (stateEl) stateEl.textContent = stateText;
  }

  function removeTile(peerId) {
    const tile = document.getElementById(tileId(peerId));
    if (tile) tile.remove();
    analysers.delete(peerId);
  }

  function watchVolume(peerId, stream) {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const source = audioCtx.createMediaStreamSource(stream);
    const analyser = audioCtx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.6;
    source.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    analysers.set(peerId, { analyser, data });
    if (!rafId) tickVolumes();
  }

  function tickVolumes() {
    analysers.forEach(({ analyser, data }, peerId) => {
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a, b) => a + b, 0) / data.length;
      const tile = document.getElementById(tileId(peerId));
      if (!tile || tile.classList.contains("muted") || tile.classList.contains("reconnecting")) return;
      const speaking = avg > 14;
      tile.classList.toggle("speaking", speaking);
      const stateEl = tile.querySelector(".state");
      if (stateEl) stateEl.textContent = speaking ? "Speaking" : "Listening";
    });
    rafId = requestAnimationFrame(tickVolumes);
  }

  function stopVolumeWatch() {
    if (rafId) cancelAnimationFrame(rafId);
    rafId = null;
    analysers.clear();
  }

  function updateMuteUI() {
    muteBtn.classList.toggle("active", isMuted);
    const tile = getTile("local", localName + " (you)");
    tile.classList.toggle("muted", isMuted);
    setTileState("local", isMuted ? "Muted" : "Listening", { muted: isMuted });
  }

  function toggleMute() {
    if (!localStream) return;
    isMuted = !isMuted;
    localStream.getAudioTracks().forEach((t) => (t.enabled = !isMuted));
    updateMuteUI();
  }

  async function findOutputDeviceId(wantEarpiece) {
    if (!navigator.mediaDevices?.enumerateDevices) return null;
    try {
      const devices = await navigator.mediaDevices.enumerateDevices();
      const outputs = devices.filter((d) => d.kind === "audiooutput");
      const match = outputs.find((d) =>
        wantEarpiece ? /ear/i.test(d.label) : /speaker/i.test(d.label)
      );
      return match ? match.deviceId : null;
    } catch {
      return null;
    }
  }

  async function applySinkTo(audioEl) {
    if (!audioEl) return;
    if (typeof audioEl.setSinkId === "function") {
      const deviceId = await findOutputDeviceId(!onSpeaker);
      if (deviceId) {
        try { await audioEl.setSinkId(deviceId); } catch { /* not supported here */ }
      }
    }
    audioEl.volume = onSpeaker ? 1.0 : 0.55;
  }

  function applySinkToAll() {
    audioContainer.querySelectorAll("audio").forEach(applySinkTo);
  }

  function toggleSpeaker() {
    onSpeaker = !onSpeaker;
    speakerBtn.classList.toggle("active", onSpeaker);
    speakerLabel.textContent = onSpeaker ? "SPEAKER" : "EARPIECE";
    applySinkToAll();
  }

  async function joinCall() {
    roomId = roomInput.value.trim();
    localName = nameInput.value.trim().slice(0, 24) || "Anonymous";
    if (!roomId) { setLobbyStatus("enter a room code first"); return; }

    joinBtn.disabled = true;
    setLobbyStatus("setting up connection...");
    await loadIceServers();

    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
    } catch (err) {
      setLobbyStatus("microphone permission required");
      joinBtn.disabled = false;
      return;
    }

    lobby.style.display = "none";
    callScreen.style.display = "flex";
    roomLabel.textContent = roomId;

    getTile("local", localName + " (you)");
    watchVolume("local", localStream);
    updateMuteUI();
    speakerBtn.classList.add("active");
    applySinkToAll();
    setCallStatus("waiting for others to join...");

    socket.emit("join", { roomId, name: localName });
  }

  function createPeerConnection(peerId, label) {
    const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
    peers.set(peerId, pc);

    localStream.getTracks().forEach((track) => pc.addTrack(track, localStream));
    getTile(peerId, label || peerNames.get(peerId) || "Anonymous");

    pc.onicecandidate = (event) => {
      if (event.candidate) socket.emit("signal", { to: peerId, data: { candidate: event.candidate } });
    };

    pc.ontrack = (event) => {
      let audioEl = document.getElementById("audio-" + peerId);
      if (!audioEl) {
        audioEl = document.createElement("audio");
        audioEl.id = "audio-" + peerId;
        audioEl.autoplay = true;
        audioEl.playsInline = true;
        audioContainer.appendChild(audioEl);
      }
      audioEl.srcObject = event.streams[0];
      applySinkTo(audioEl);
      watchVolume(peerId, event.streams[0]);
      setTileState(peerId, "Listening");
      setCallStatus("connected — call in progress");
    };

    pc.onconnectionstatechange = () => {
      if (pc.connectionState === "disconnected") {
        setTileState(peerId, "Reconnecting", { reconnecting: true });
      } else if (["failed", "closed"].includes(pc.connectionState)) {
        removePeer(peerId);
      } else if (pc.connectionState === "connected") {
        setTileState(peerId, "Listening");
      }
    };

    return pc;
  }

  function removePeer(peerId) {
    const pc = peers.get(peerId);
    if (pc) { pc.close(); peers.delete(peerId); }
    const audioEl = document.getElementById("audio-" + peerId);
    if (audioEl) audioEl.remove();
    removeTile(peerId);
    if (peers.size === 0 && localStream) setCallStatus("waiting for others to join...");
  }

  async function callPeer(peerId) {
    const pc = createPeerConnection(peerId);
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    socket.emit("signal", { to: peerId, data: { sdp: offer } });
  }

  socket.on("joined", async ({ existingPeers }) => {
    for (const p of existingPeers) {
      peerNames.set(p.peerId, p.name);
      await callPeer(p.peerId);
    }
  });

  socket.on("room-full", () => {
    alert("This room already has 6 people in it (max for group calls). Try a different code.");
    hangup();
  });

  socket.on("peer-joined", async ({ peerId, name }) => {
    peerNames.set(peerId, name);
  });

  socket.on("signal", async ({ from, data }) => {
    let pc = peers.get(from);
    if (!pc) pc = createPeerConnection(from);

    if (data.sdp) {
      await pc.setRemoteDescription(new RTCSessionDescription(data.sdp));
      if (data.sdp.type === "offer") {
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        socket.emit("signal", { to: from, data: { sdp: answer } });
      }
    } else if (data.candidate) {
      try { await pc.addIceCandidate(new RTCIceCandidate(data.candidate)); }
      catch (e) { console.error("ICE candidate error", e); }
    }
  });

  socket.on("peer-left", ({ peerId }) => removePeer(peerId));

  function hangup() {
    socket.emit("hangup");
    peers.forEach((pc) => pc.close());
    peers.clear();
    audioContainer.innerHTML = "";
    grid.innerHTML = "";
    stopVolumeWatch();
    if (localStream) { localStream.getTracks().forEach((t) => t.stop()); localStream = null; }

    isMuted = false;
    onSpeaker = true;
    speakerBtn.classList.add("active");
    speakerLabel.textContent = "SPEAKER";
    peerNames.clear();
    callScreen.style.display = "none";
    lobby.style.display = "flex";
    joinBtn.disabled = false;
    roomInput.value = "";
    setLobbyStatus("");
    setCallStatus("");

    socket.disconnect();
    socket.connect();
  }

  joinBtn.addEventListener("click", joinCall);
  hangupBtn.addEventListener("click", hangup);
  muteBtn.addEventListener("click", toggleMute);
  speakerBtn.addEventListener("click", toggleSpeaker);
  roomInput.addEventListener("keydown", (e) => { if (e.key === "Enter") joinCall(); });

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("/sw.js").catch((err) => console.error("SW registration failed:", err));
    });
  }

  // ---------- installability ----------
  // Chrome's automatic install banner only shows once certain engagement
  // heuristics are met, which can feel like "nothing happens." Capturing
  // beforeinstallprompt lets us offer a reliable, always-visible button instead.
  const installBtn = document.getElementById("installBtn");
  let deferredInstallPrompt = null;

  window.addEventListener("beforeinstallprompt", (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    installBtn.style.display = "block";
  });

  installBtn.addEventListener("click", async () => {
    if (!deferredInstallPrompt) return;
    deferredInstallPrompt.prompt();
    await deferredInstallPrompt.userChoice;
    deferredInstallPrompt = null;
    installBtn.style.display = "none";
  });

  window.addEventListener("appinstalled", () => {
    installBtn.style.display = "none";
  });

  // iOS Safari never fires beforeinstallprompt — give a one-time text hint instead.
  const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone;
  if (isIos && !isStandalone) {
    setLobbyStatus("on iPhone: tap Share → Add to Home Screen to install");
  }
</script>
</body>
</html>
